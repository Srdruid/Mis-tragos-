
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Éclat Bar | Nuestra Carta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111111;
      color: #f5e6c8;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 55px 20px 35px;
      background: linear-gradient(160deg, #242019, #111111);
      border-bottom: 1px solid #b99a59;
    }

    .logo {
      color: #d9b66f;
      font-size: 38px;
      letter-spacing: 5px;
      margin: 0;
    }

    .subtitle {
      color: #e8d8b7;
      letter-spacing: 2px;
      font-size: 13px;
      margin-top: 15px;
    }

    main {
      max-width: 750px;
      margin: auto;
      padding: 35px 18px;
    }

    h2 {
      color: #d9b66f;
      font-size: 25px;
    }

    .intro {
      color: #d5cbb8;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .carta {
      display: block;
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      border: 1px solid #806b42;
      border-radius: 8px;
    }

    .aviso {
      color: #c6b99f;
      font-size: 14px;
      line-height: 1.6;
      margin-top: 25px;
    }

    footer {
      border-top: 1px solid #5b4b30;
      padding: 25px 15px;
      color: #bca879;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1 class="logo">ÉCLAT BAR</h1>
    <p class="subtitle">UNA EXPERIENCIA EN CADA TRAGO</p>
  </header>

  <main>
    
<img src="cartatragos.png" alt="Carta de tragos de Éclat Bar" class="carta">
    

    <p class="intro">
      Descubrí nuestros tragos, disfrutá nuevos sabores
      y encontrá tu favorito.
      En Éclat Bar, cada detalle hace la diferencia.
    </p>

    <!-- Aquí incorporaremos las imágenes de tu carta -->

    <div id="imagenes"></div>

    <p class="aviso">
      Elegí tu trago favorito y disfrutá la experiencia Éclat Bar.
    </p>
  </main>

  <footer>
    ÉCLAT BAR · Gracias por elegirnos
  </footer>
</body>
    </html>
